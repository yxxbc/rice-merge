name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 依赖
        run: sudo apt-get update && sudo apt-get install -y shellcheck rsync
      - name: lint + test
        run: make check
