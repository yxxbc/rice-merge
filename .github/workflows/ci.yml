name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 依赖
        run: sudo apt-get update && sudo apt-get install -y shellcheck rsync
      - name: lint + test + e2e
        run: make check
      - name: live 安装器 dry-run
        run: make live-dry-run
